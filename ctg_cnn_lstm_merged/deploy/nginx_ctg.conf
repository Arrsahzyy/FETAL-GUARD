server {
    listen 80;
    server_name api.domainanda.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Cara pakai di VPS:
#   sudo cp nginx_ctg.conf /etc/nginx/sites-available/ctg-api
#   sudo ln -s /etc/nginx/sites-available/ctg-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.domainanda.com   # aktifkan HTTPS gratis
